[pytest]
# 테스트는 모듈마다 <모듈>/tests/ 에, 루트 pipeline.py 테스트는 tests/pipeline/ 에 둔다
testpaths = modules tests
python_files = test_*.py
# modules/는 공용 폴더라 __init__.py를 두지 않는다(네임스페이스 패키지). 이 두 줄이 없으면 pytest가 modules/를
# sys.path에 넣고 테스트를 collector.tests.* 로 올려, 코드가 쓰는 modules.collector.* 와 이름이 갈린다.
pythonpath = .
consider_namespace_packages = true
