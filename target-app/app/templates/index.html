{% extends "base.html" %}
{% block title %}상품목록 - Test Shop{% endblock %}
{% block content %}
<h2>상품 목록</h2>
<div class="grid">
  {% for p in products %}
  <a href="/products/{{ p.id }}">
    <div class="card">
      <div class="emoji">{{ p.image_emoji }}</div>
      <h3>{{ p.name }}</h3>
      <div class="price">{{ "{:,.0f}".format(p.price) }}원</div>
    </div>
  </a>
  {% endfor %}
</div>
{% endblock %}
