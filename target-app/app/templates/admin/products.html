{% extends "base.html" %}
{% block title %}상품 관리 - Test Shop{% endblock %}
{% block content %}
<h2>상품 관리</h2>
<p><a href="/admin/products/new" class="btn">+ 상품 추가</a></p>
<table>
  <tr><th>ID</th><th>이름</th><th>가격</th><th>재고</th><th></th></tr>
  {% for p in products %}
  <tr>
    <td>{{ p.id }}</td><td>{{ p.name }}</td>
    <td>{{ "{:,.0f}".format(p.price) }}원</td><td>{{ p.stock }}</td>
    <td>
      <a href="/admin/products/{{ p.id }}/edit" class="btn secondary">수정</a>
      <form class="inline" method="post" action="/admin/products/{{ p.id }}/delete" style="display:inline">
        <button type="submit" class="btn danger" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
