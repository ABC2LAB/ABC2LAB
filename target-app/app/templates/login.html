{% extends "base.html" %}
{% block title %}로그인 - Test Shop{% endblock %}
{% block content %}
<h2>로그인</h2>
<form class="box" method="post" action="/login">
  <label>이메일</label>
  <input type="email" name="email" required>
  <label>비밀번호</label>
  <input type="password" name="password" required>
  <button type="submit" class="btn" style="margin-top:16px">로그인</button>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
</form>
{% endblock %}
