# collector 설정 예시(비밀값 없음). 복사해서 같은 폴더의 collector.toml로 쓴다. collector.toml은 로컬 파일이라 git에서 뺀다.
# 위치: CLI --config > COLLECTOR_CONFIG_PATH > modules/collector/configs/collector.toml
# 계정 로그인 ID·비밀번호는 여기 넣지 않는다. .env의 COLLECTOR_ACCOUNT_<별칭 대문자>_LOGIN_ID / _PASSWORD (modules/collector/.env.example)

# 대상. 로컬(localhost/127.0.0.1/::1) http(s)만 허용된다.
target_url = "http://localhost:8001"
# 대상 외에 허용할 origin. 비우면 대상 origin만.
extra_allowed_origins = []
# 탐색 깊이(0 이상의 정수)
max_depth = 3
# 상태 변경 동작 실행 허용(true/false만)
allow_state_changing = false
# 상태 변경으로 볼 이름 조각. 빼면 기본 목록(logout·delete·로그아웃·삭제 등)
# state_changing_keywords = ["logout", "delete"]

# 계정 있는 역할(소문자로 시작, 소문자·숫자·_). guest는 자동으로 들어가니 적지 않는다. 역할마다 계정이 하나 이상 있어야 한다.
roles = ["user", "admin"]

# 로그인 폼. 계정이 있으면 필수. 필드 이름은 input의 name 속성.
[login]
path = "/login"
username_field = "change-me"
password_field = "change-me"
# left_login_page | url_contains | cookie_present | text_present. left_login_page 외에는 success_value(비교할 URL 조각·쿠키 이름·문구)가 필수.
success_check = "left_login_page"
# success_value = ""

# 계정 별칭과 역할. 별칭은 crawl_result에 그대로 나가므로 로그인 ID와 다르게 짓는다(같으면 설정 오류).
[[accounts]]
alias = "user_a"
role = "user"

[[accounts]]
alias = "user_b"
role = "user"

[[accounts]]
alias = "admin_a"
role = "admin"
