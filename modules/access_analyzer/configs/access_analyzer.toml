# access_analyzer 규칙 설정. 처음 보는 앱도 코드가 아니라 이 파일로 조정한다.
# 위치: ACCESS_ANALYZER_CONFIG_PATH > 이 파일. 대상 앱 값(역할 ID 순서 등)은 이 파일을 고치지 말고 레포 밖 복사본에 적고
# 환경변수로 가리킨다. 규칙은 대상 앱의 URL·역할 이름·필드명이 아니라 구조(소유 관계·역할 ID·접근 집합)로만 판단한다.

[rules.same_role_other_owner]
# 같은 역할의 다른 계정이 소유자의 자원에 접근 가능한지(수평 인가) 후보를 만든다.
enabled = true
# 한 번에 만들 후보 상한. 넘으면 그때까지만 만들고 CANDIDATES_TRUNCATED 오류를 남긴다.
max_candidates = 100

[rules.vertical_access]
# 낮은 역할 계정이 높은 역할만 2xx로 쓴 엔드포인트에 접근 가능한지(기능 수준 인가·강제 브라우징) 후보를 만든다.
# crawl_result 입력이 있어야 돈다(응답 상태·세션 유무가 필요).
enabled = true
# 규칙별 상한. 넘으면 CANDIDATES_TRUNCATED.
max_candidates = 100
# 낮은 역할 → 높은 역할 순서의 role_id. 비우면 관찰로 추정한다(2xx 엔드포인트 집합이 진부분집합이면 낮은 역할).
# 설정이 있으면 설정이 우선이고, 관찰과 어긋나면 경고 로그를 남긴다. 예(레포 밖 복사본에): ["role:guest", "role:user", "role:admin"]
role_order = []
# 접근 성공으로 보는 응답 상태 범위(포함). 역할의 접근 집합과 "이미 공유된 엔드포인트" 판단에 쓴다.
success_status_range = [200, 299]
# 낮은 역할이 이 상태로 관찰한 엔드포인트는 거절을 이미 관찰한 것이라 후보에서 뺀다.
# 그 밖(3xx·400·404·405·422 등)은 인가 판단 근거가 아니라 후보로 남긴다.
denied_status_codes = [401, 403]
