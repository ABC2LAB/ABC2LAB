[project]
name = "ai-web-vulnerability-kg"
version = "0.1.0"
description = "Playwright JSON to validated knowledge graph API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "neo4j==6.3.1",
    "openai==3.19.2",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
crawler = [
    "playwright==1.63.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

